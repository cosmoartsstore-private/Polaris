Runtime.installInformationUnavailable=インストール情報を取得できませんでした。再インストールしてください。
Runtime.installDirectoryMissing=インストール先フォルダが見つかりません。再インストールしてください。
Runtime.profileDirectoryUnavailable=VRChatのログ排出先を特定できないため終了します。
